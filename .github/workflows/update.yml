name: update-signals

on:
  push:
    branches: [main]
    paths:
      - "watchlist.json"
      - "scripts/update.py"
      - ".github/workflows/update.yml"
  schedule:
    # every 30 minutes, Mon-Fri, 08:00-21:59 UTC (09:00-22:59 Algeria time)
    # minutes 20 and 50 so the 30-minute candles have closed and Yahoo has them
    - cron: "20,50 8-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and compute signals
        run: python scripts/update.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "update signals"
          git pull --rebase origin main
          git push
